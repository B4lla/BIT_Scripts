    <path d="M10 28 L22 12 L30 12 L34 28" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 28 L22 12" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10 28 L18 28 L30 12" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M30 12 L32 8 M28 8 L32 8 L36 8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    
