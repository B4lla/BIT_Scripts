    <path d="M 0,0 L 12,0 L 8,-8 Z" fill="#000000"/>

    <circle cx="-4" cy="-5" r="2" fill="#000000"/>

    <circle cx="-3" cy="-6" r="0.8" fill="#ffffff"/>
  </g>
  
  <circle cx="50" cy="18" r="2" fill="#ffff00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="54" cy="28" r="1.5" fill="#ffff00">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="38" r="1.8" fill="#ffff00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="48" cy="48" r="3.5" fill="#ffff00">
