      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </radialGradient>
    <radialGradient id="pacman" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffff55"/>
      <stop offset="100%" style="stop-color:#ffcc00"/>
