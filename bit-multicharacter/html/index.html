<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT-Multicharacter</title>
    <link rel="preload" href="./styles.css" as="style">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script defer src="./lib/tail.js"></script>
    <script defer src="./lib/vue.global.prod.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="./styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b'
                        },
                        neo: {
                            100: '#1affec',
                            200: '#14b8a6',
                            300: '#0d9488',
                            400: '#0f766e',
                            500: '#134e4a'
                        }
                    },
                    fontFamily: {
                        'sans': ['Exo 2', 'ui-sans-serif', 'system-ui'],
                        'display': ['Rajdhani', 'sans-serif'],
                        'accent': ['Syncopate', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite',
                        'fade-scale': 'fadeScale 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'rotate-icon': 'rotateIcon 8s linear infinite',
                        'slow-spin': 'slowSpin 15s linear infinite',
                        'card-appear': 'cardAppear 0.5s ease-out forwards',
                        'gradient-animation': 'gradientAnimation 15s ease infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                        'expand-line': 'expandLine 1s ease-out forwards',
                        'glitch-fade': 'glitchFade 0.3s linear forwards',
                        'scan-glow': 'scanGlow 2s linear infinite',
                        'typewriter': 'typewriter 2.5s steps(40, end) forwards',
                        'blink-cursor': 'blinkCursor 0.75s step-end infinite',
                        'wave-border': 'waveBorder 2s infinite linear',
                        'border-glow': 'borderGlow 3s ease infinite',
                        'pulse-status': 'pulseStatus 2s infinite'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' }
                        },
                        glow: {
                            '0%, 100%': { boxShadow: '0 4px 20px rgba(16, 185, 129, 0.3)' },
                            '50%': { boxShadow: '0 8px 40px rgba(16, 185, 129, 0.6)' }
                        },
                        fadeScale: {
                            'from': { opacity: '0', transform: 'scale(0.96) translateY(10px)' },
                            'to': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        },
                        rotateIcon: {
                            'from': { transform: 'rotate(0deg)' },
                            'to': { transform: 'rotate(360deg)' }
                        },
                        slowSpin: {
                            'from': { transform: 'rotate(0deg)' },
                            'to': { transform: 'rotate(360deg)' }
                        },
                        cardAppear: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        gradientAnimation: {
                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' }
                        },
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        },
                        expandLine: {
                            '0%': { width: '0', opacity: '0' },
                            '100%': { width: '100%', opacity: '1' }
                        },
                        glitchFade: {
                            '0%': { clipPath: 'inset(0 0 0 0)', opacity: '0' },
                            '20%': { clipPath: 'inset(20% 0 0 0)', opacity: '0.3' },
                            '40%': { clipPath: 'inset(0 0 15% 0)', opacity: '0.6' },
                            '60%': { clipPath: 'inset(0 10% 0 0)', opacity: '0.8' },
                            '80%': { clipPath: 'inset(0 0 0 5%)', opacity: '0.9' },
                            '100%': { clipPath: 'inset(0 0 0 0)', opacity: '1' }
                        },
                        scanGlow: {
                            '0%': { backgroundPosition: '-100% 0' },
                            '100%': { backgroundPosition: '200% 0' }
                        },
                        typewriter: {
                            'from': { width: '0' },
                            'to': { width: '100%' }
                        },
                        blinkCursor: {
                            '50%': { borderRightColor: 'transparent' }
                        },
                        waveBorder: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        },
                        borderGlow: {
                            '0%': { backgroundPosition: '0% 0%' },
                            '50%': { backgroundPosition: '100% 100%' },
                            '100%': { backgroundPosition: '0% 0%' }
                        },
                        pulseStatus: {
                            '0%': { transform: 'scale(1)', opacity: '0.8' },
                            '70%': { transform: 'scale(2)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '0' }
                        }
                    },
                }
            }
        }
    </script>
