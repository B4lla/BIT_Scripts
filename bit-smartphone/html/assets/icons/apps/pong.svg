<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pongGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#008800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paddleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cccccc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="20" ry="20" fill="url(#pongGradient)"/>
  
  <rect x="10" y="15" width="80" height="70" rx="5" ry="5" fill="#000000" stroke="#00ff00" stroke-width="2"/>
  
  <line x1="50" y1="15" x2="50" y2="85" stroke="#333333" stroke-width="1" stroke-dasharray="3,3"/>
  
  <rect x="15" y="40" width="3" height="20" fill="url(#paddleGradient)" rx="1"/>
  
  <rect x="82" y="35" width="3" height="20" fill="#ff4444" rx="1"/>

  <circle cx="35" cy="45" r="3" fill="#ffffff">
    <animate attributeName="cx" values="35;65;35" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="45;55;45" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <text x="25" y="30" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">3</text>
  <text x="75" y="30" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">2</text>

  <rect x="10" y="15" width="80" height="70" rx="5" ry="5" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
