<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blockGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blockGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blockGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blockGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blockGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.4" flood-color="#000"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="60" height="60" rx="13" ry="13" fill="url(#bgGrad)" stroke="#667eea" stroke-width="1"/>

  <g filter="url(#dropShadow)">
    <rect x="12" y="42" width="36" height="8" rx="2" fill="url(#blockGrad1)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/>
    </rect>

    <rect x="12" y="42" width="36" height="2" rx="2" fill="rgba(255,255,255,0.3)"/>

    <rect x="15" y="34" width="30" height="8" rx="2" fill="url(#blockGrad2)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="34" width="30" height="2" rx="2" fill="rgba(255,255,255,0.3)"/>

    <rect x="18" y="26" width="24" height="8" rx="2" fill="url(#blockGrad3)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="18" y="26" width="24" height="2" rx="2" fill="rgba(255,255,255,0.3)"/>
    
    <rect x="21" y="18" width="18" height="8" rx="2" fill="url(#blockGrad4)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="21" y="18" width="18" height="2" rx="2" fill="rgba(255,255,255,0.3)"/>
    
    <rect x="24" y="10" width="12" height="8" rx="2" fill="url(#blockGrad5)" filter="url(#glow)">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 8,0; -8,0; 0,0" 
        dur="2s" 
        repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="10" width="12" height="2" rx="2" fill="rgba(255,255,255,0.4)">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; 8,0; -8,0; 0,0" 
        dur="2s" 
        repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="15" cy="15" r="1" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="45" cy="20" r="1.5" fill="#667eea" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="45" r="1" fill="#f093fb" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
