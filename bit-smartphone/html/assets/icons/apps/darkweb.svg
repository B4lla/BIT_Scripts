<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#660000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3333;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <rect x="2" y="2" width="56" height="56" rx="12" ry="12" fill="url(#darkGradient)" stroke="#ff3333" stroke-width="1" opacity="0.9"/>
  
  <rect x="4" y="4" width="52" height="52" rx="10" ry="10" fill="none" stroke="rgba(255,51,51,0.3)" stroke-width="1"/>

  <g transform="translate(30,30)">
    <circle cx="0" cy="-8" r="8" fill="url(#redGlow)" opacity="0.8"/>

    <rect x="-10" y="2" width="20" height="16" rx="3" fill="url(#redGlow)" opacity="0.8"/>

    <path d="M -12,-12 Q 0,-18 12,-12 L 10,-2 Q 0,-6 -10,-2 Z" fill="#000000" opacity="0.9"/>

    <circle cx="-4" cy="-8" r="2" fill="#ff3333"/>
    <circle cx="4" cy="-8" r="2" fill="#ff3333"/>
    <circle cx="-4" cy="-8" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="4" cy="-8" r="1" fill="#ffffff" opacity="0.8"/>
  </g>

  <g opacity="0.4">
    <line x1="10" y1="45" x2="20" y2="45" stroke="#ff3333" stroke-width="1"/>
    <line x1="15" y1="40" x2="15" y2="50" stroke="#ff3333" stroke-width="1"/>
    <circle cx="15" cy="45" r="2" fill="none" stroke="#ff3333" stroke-width="1"/>
    
    <line x1="40" y1="15" x2="50" y2="15" stroke="#ff3333" stroke-width="1"/>
    <line x1="45" y1="10" x2="45" y2="20" stroke="#ff3333" stroke-width="1"/>
    <circle cx="45" cy="15" r="2" fill="none" stroke="#ff3333" stroke-width="1"/>
  </g>

  <circle cx="12" cy="12" r="1" fill="#ff3333" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="48" r="1" fill="#ff3333" opacity="0.6">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
