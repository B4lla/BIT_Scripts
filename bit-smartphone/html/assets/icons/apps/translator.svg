<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">

  <rect width="512" height="512" rx="80" fill="url(#gradient1)"/>

  <circle cx="256" cy="256" r="200" fill="url(#gradient2)" opacity="0.9"/>

